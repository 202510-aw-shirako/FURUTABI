<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FURUTABI Wire | Notice</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="public_secondary"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="お知らせ詳細">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 単一テンプレートの詳細ページ。
         Java化では slug / id を path variable にして、
         サーバー描画または詳細 API の結果をここに流し込む想定。 -->
    <div data-notice-detail-root data-notice-base=""></div>

    <section class="section">
      <!-- TODO: 観光協会サイトの正式URL確定後、ここに外部リンクを設定 -->
      <div class="noticeExternalPlaceholder">
        <div>
          <div class="h2">地域全体の観光情報について</div>
          <p class="note">催しや広域の観光情報は、観光協会サイトへの外部導線をここに設置する想定です。</p>
        </div>
        <span class="noticeExternalBadge">外部リンク想定</span>
      </div>
    </section>
  </main>

  <script src="./assets/scripts/shared-ui.js"></script>
  <script src="./assets/scripts/notices.js"></script>
</body>
</html>
