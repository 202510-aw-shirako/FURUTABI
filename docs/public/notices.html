<!doctype html>
<html lang="ja">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FURUTABI Wire | お知らせ</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="public_secondary"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="お知らせ一覧">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <h1 class="h1">お知らせ</h1>
      <p class="lead">入口の公開タイミングや案内の更新を、一覧で確認できます。</p>
    </section>

    <section class="section">
      <!-- 一覧ページは preview 用の項目だけを描画する。
           Java化では一覧 API やサーバー描画結果をここに差し込む想定。 -->
      <div class="noticeList" data-notice-list-items data-notice-base=""></div>
    </section>

    <section class="section">
      <!-- TODO: 観光協会サイトの正式URL確定後、ここに外部リンクを設定 -->
      <div class="noticeExternalPlaceholder">
        <div>
          <div class="h2">地域全体の観光情報について</div>
          <p class="note">催しや広域の観光情報は、観光協会サイトへの外部導線をここに設置する想定です。</p>
        </div>
        <span class="noticeExternalBadge">外部リンク想定</span>
      </div>
    </section>
  </main>

  <script src="assets/scripts/shared-ui.js"></script>
  <script src="assets/scripts/notices.js"></script>
</body>
</html>
