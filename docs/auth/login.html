<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FURUTABI Wire | Login</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="auth_login"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ログイン">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <h1 class="h1">ログイン</h1>
      <p class="lead">ここでは既存アカウントのログインだけを最小実装しています。</p>
    </section>

    <section class="section">
      <div class="grid2 loginRoleGrid">
        <div class="card">
          <div class="h2">既存アカウントでログイン</div>
          <p class="note">今の段階では <code>/login</code> と <code>/logout</code> の最小実装だけを接続しています。</p>

          <div class="denseBox" th:if="${param.error}" style="margin-top:16px;">
            <div>
              <div class="h2">ログインに失敗しました</div>
              <p class="note">メールアドレスまたはパスワードを確認してください。</p>
            </div>
          </div>

          <div class="denseBox" th:if="${param.logout}" style="margin-top:16px;">
            <div>
              <div class="h2">ログアウトしました</div>
              <p class="note">セッションを終了しました。</p>
            </div>
          </div>

          <form action="login.html" method="post" style="display:grid; gap:12px; margin-top:16px;">
            <div>
              <label class="small" for="email">メールアドレス</label>
              <input id="email" name="email" type="email" class="input" autocomplete="username" required />
            </div>
            <div>
              <label class="small" for="password">パスワード</label>
              <input id="password" name="password" type="password" class="input" autocomplete="current-password" required />
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="returnTo" th:if="${returnTo != null}" th:value="${returnTo}" />
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn primary" type="submit">ログイン</button>
            </div>
          </form>

          <div class="denseBox" style="margin-top:16px;">
            <div>
              <div class="h2">はじめての方</div>
              <p class="note">新規登録や SMS 認証は次の作業で接続します。</p>
            </div>
            <a class="btn ghost" href="register.html">新規登録へ</a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
