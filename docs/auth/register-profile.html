<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>プロフィール入力 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="auth_login"></nav>
      </div>
    </div>
  </header>

  <main class="container authPage" aria-label="プロフィール入力">
    <section class="authFlowShell">
      <div class="authFlowIntro">
        <p class="eyebrow">PROFILE</p>
        <h1 class="authFlowTitle">プロフィールを整える</h1>
        <p class="authFlowLead">ここでは最小の自己紹介と連絡設定だけを保存します。あとから変更して構いません。</p>
      </div>

      <ol class="authStepList" aria-label="登録ステップ">
        <li class="is-done"><span>1</span><strong>登録情報入力</strong></li>
        <li class="is-done"><span>2</span><strong>SMS 認証</strong></li>
        <li class="is-current"><span>3</span><strong>プロフィール</strong></li>
      </ol>

      <section class="authCard">
        <form class="authForm" action="register/profile" th:object="${registerProfileForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="authField">
            <label for="bio">自己紹介</label>
            <textarea id="bio" th:field="*{bio}" rows="4" placeholder="土地との関わり方を一言で書けます。"></textarea>
          </div>

          <div class="authField">
            <label for="region">今いる地域</label>
            <input id="region" th:field="*{region}" type="text" placeholder="東京都 / 関西 / 東北 など" />
          </div>

          <div class="authField">
            <label for="interestRegion">関心のある地域</label>
            <input id="interestRegion" th:field="*{interestRegion}" type="text" placeholder="興味のある地域" />
          </div>

          <div class="authField">
            <label for="visitHistory">訪問歴</label>
            <textarea id="visitHistory" th:field="*{visitHistory}" rows="3"></textarea>
          </div>

          <div class="authField">
            <label for="careNote">配慮してほしいこと</label>
            <textarea id="careNote" th:field="*{careNote}" rows="3"></textarea>
          </div>

          <div class="authField">
            <label for="withChildren">子ども連れかどうか</label>
            <select id="withChildren" th:field="*{withChildren}">
              <option value="">選択してください</option>
              <option value="WITH_CHILDREN">子ども連れ</option>
              <option value="WITHOUT_CHILDREN">子ども連れではない</option>
              <option value="UNSPECIFIED">状況による</option>
            </select>
          </div>

          <div class="authField">
            <label for="foodNote">食の配慮</label>
            <textarea id="foodNote" th:field="*{foodNote}" rows="3"></textarea>
          </div>

          <div class="authField">
            <label for="relationNote">関わり方メモ</label>
            <textarea id="relationNote" th:field="*{relationNote}" rows="3"></textarea>
          </div>

          <fieldset class="authField authFieldset">
            <legend>連絡設定</legend>
            <div class="authChoiceList">
              <label><input th:field="*{receiveOperationNotice}" type="checkbox" />運営からのお知らせ</label>
              <label><input th:field="*{receiveSecurityNotice}" type="checkbox" />セキュリティ通知</label>
              <label><input th:field="*{receiveBridgeContact}" type="checkbox" />Bridge からの連絡</label>
              <label><input th:field="*{receiveLocalContact}" type="checkbox" />Local からの連絡</label>
              <label><input th:field="*{receiveEmailNotice}" type="checkbox" />メール通知</label>
              <label><input th:field="*{receiveSmsNotice}" type="checkbox" />SMS 通知</label>
            </div>
          </fieldset>

          <div class="authFormActions">
            <button class="btn primary" type="submit">登録を保存する</button>
          </div>
        </form>
        <form class="authForm" action="register/profile/skip" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="authFormActions">
            <button class="btn ghost" type="submit">あとで設定する</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
