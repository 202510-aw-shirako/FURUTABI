<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>新規登録 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="auth_login"></nav>
      </div>
    </div>
  </header>

  <main class="container authPage" aria-label="新規登録">
    <section class="authFlowShell">
      <div class="authFlowIntro">
        <p class="eyebrow">SIGN UP</p>
        <h1 class="authFlowTitle">新規登録</h1>
        <p class="authFlowLead">登録時だけ SMS 認証を行い、その後にプロフィール入力へ進みます。</p>
      </div>

      <ol class="authStepList" aria-label="登録ステップ">
        <li class="is-current"><span>1</span><strong>登録情報入力</strong></li>
        <li><span>2</span><strong>SMS 認証</strong></li>
        <li><span>3</span><strong>プロフィール</strong></li>
      </ol>

      <section class="authCard">
        <div class="authCardSection">
          <h2 class="authCardTitle">登録情報を入力する</h2>
          <p class="authCardLead">`users` に必要な最小項目を先に作成し、SMS 認証後にプロフィールへ進みます。</p>
        </div>

        <form class="authForm" action="register.html" th:object="${registerForm}" method="post" novalidate>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="authField">
            <label for="name">氏名</label>
            <input id="name" th:field="*{name}" type="text" />
            <p class="authError" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
          </div>

          <div class="authField">
            <label for="nameKana">ふりがな</label>
            <input id="nameKana" th:field="*{nameKana}" type="text" />
            <p class="authError" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></p>
          </div>

          <div class="authField">
            <label for="birthday">生年月日</label>
            <input id="birthday" th:field="*{birthday}" type="date" />
            <p class="authError" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></p>
          </div>

          <div class="authField">
            <label for="gender">性別</label>
            <select id="gender" th:field="*{gender}">
              <option value="">選択してください</option>
              <option value="MALE">男性</option>
              <option value="FEMALE">女性</option>
              <option value="NO_ANSWER">回答しない</option>
            </select>
            <p class="authError" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>
          </div>

          <div class="authField">
            <label for="email">メールアドレス</label>
            <input id="email" th:field="*{email}" type="email" />
            <p class="authError" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
          </div>

          <div class="authField">
            <label for="phoneNumber">電話番号</label>
            <input id="phoneNumber" th:field="*{phoneNumber}" type="tel" />
            <p class="authError" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
          </div>

          <div class="authField">
            <label for="address">住所</label>
            <input id="address" th:field="*{address}" type="text" />
            <p class="authError" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
          </div>

          <div class="authField">
            <label for="nickname">ニックネーム</label>
            <input id="nickname" th:field="*{nickname}" type="text" />
            <p class="authError" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
          </div>

          <div class="authField">
            <label for="password">パスワード</label>
            <input id="password" th:field="*{password}" type="password" autocomplete="new-password" />
            <p class="authError" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
          </div>

          <div class="authField">
            <label for="passwordConfirm">パスワード確認</label>
            <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password" autocomplete="new-password" />
            <p class="authError" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
          </div>

          <fieldset class="authField authFieldset">
            <legend>同意</legend>
            <div class="authChoiceList">
              <label><input th:field="*{agreedToTerms}" type="checkbox" />利用規約に同意する</label>
              <label><input th:field="*{agreedToPrivacyPolicy}" type="checkbox" />プライバシーポリシーに同意する</label>
              <label><input th:field="*{agreedToSmsNotice}" type="checkbox" />SMS 認証の案内に同意する</label>
            </div>
            <p class="authError" th:if="${#fields.hasErrors('agreedToTerms')}" th:errors="*{agreedToTerms}"></p>
            <p class="authError" th:if="${#fields.hasErrors('agreedToPrivacyPolicy')}" th:errors="*{agreedToPrivacyPolicy}"></p>
            <p class="authError" th:if="${#fields.hasErrors('agreedToSmsNotice')}" th:errors="*{agreedToSmsNotice}"></p>
          </fieldset>

          <div class="authFormActions">
            <button class="btn primary" type="submit">SMS 認証へ進む</button>
            <a class="btn ghost" href="login.html">ログインへ戻る</a>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
