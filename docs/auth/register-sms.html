<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMS 認証 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="auth_login"></nav>
      </div>
    </div>
  </header>

  <main class="container authPage authPage--centered" aria-label="SMS 認証">
    <section class="authFlowShell authFlowShell--narrow">
      <div class="authFlowIntro">
        <p class="eyebrow">SMS VERIFY</p>
        <h1 class="authFlowTitle">SMS 認証</h1>
        <p class="authFlowLead">登録時だけ使用する認証です。コード確認後にプロフィール入力へ進みます。</p>
      </div>

      <ol class="authStepList" aria-label="登録ステップ">
        <li class="is-done"><span>1</span><strong>登録情報入力</strong></li>
        <li class="is-current"><span>2</span><strong>SMS 認証</strong></li>
        <li><span>3</span><strong>プロフィール</strong></li>
      </ol>

      <section class="authCard">
        <div class="authCardSection">
          <h2 class="authCardTitle">認証コードを確認する</h2>
          <p class="authCardLead">
            <span th:text="${phoneNumber}">090-0000-0000</span>
            宛てに認証コードを送ります。
          </p>
        </div>

        <div class="denseBox" th:if="${param.resent}" style="margin-bottom:16px;">
          <div>
            <div class="h2">認証コードを再発行しました</div>
            <p class="note">直近のコードだけが有効です。</p>
          </div>
        </div>

        <div class="denseBox" th:if="${!smsEnabled and developmentCode != null}" style="margin-bottom:16px;">
          <div>
            <div class="h2">開発用コード</div>
            <p class="note">実 SMS 未接続のため、現在の確認コードを表示しています。</p>
            <code th:text="${developmentCode}">123456</code>
          </div>
        </div>

        <form class="authForm" action="register/sms/verify" th:object="${registerSmsForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="authField">
            <label for="code">認証コード</label>
            <input id="code" th:field="*{code}" type="text" inputmode="numeric" placeholder="123456" />
            <p class="authError" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></p>
          </div>

          <div class="authFormActions">
            <button class="btn primary" type="submit">認証して次へ</button>
          </div>
        </form>

        <div class="authFormActions" style="margin-top:12px;">
          <form action="register/sms/send" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn ghost" type="submit">コードを再送する</button>
          </form>
          <a class="btn ghost" href="register.html">登録内容へ戻る</a>
        </div>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
