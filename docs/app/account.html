<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>アカウント情報 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="アカウント情報">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="マイページナビゲーション">
        <div class="mypageSidebarInner">
          <h2 class="mypageSidebarTitle">アカウント</h2>
          <nav class="mypageNav">
            <a class="mypageNavLink" href="mypage.html">マイページ</a>
            <a class="mypageNavLink is-current" href="account.html" aria-current="page">アカウント情報</a>
            <a class="mypageNavLink" href="profile.html">プロフィール編集</a>
            <a class="mypageNavLink" href="privacy-settings.html">公開範囲とプライバシー</a>
          </nav>
        </div>
      </aside>

      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1">アカウント情報</h1>
          <p class="lead">register 時に保存した基礎情報を見直し、login 後に最低限の更新ができるようにした画面です。</p>
        </div>

        <div class="mypageNoticeBox" th:if="${param.saved}">
          <p>アカウント情報を更新しました。</p>
        </div>

        <section class="mypageSection">
          <div class="sectionTitleRow">
            <h2 class="h2">現在の認証状態</h2>
          </div>
          <div class="mypageStatusGrid">
            <article class="mypageStatusCard">
              <p class="mypageStatusLabel">メールアドレス</p>
              <div class="mypageStatusValue"><span th:text="${accountEmail}">user@example.com</span></div>
            </article>
            <article class="mypageStatusCard">
              <p class="mypageStatusLabel">SMS認証</p>
              <div class="mypageStatusValue"><span class="pill pill--soft" th:text="${smsVerified} ? '認証済み' : '未認証'">認証済み</span></div>
            </article>
            <article class="mypageStatusCard">
              <p class="mypageStatusLabel">追加本人確認</p>
              <div class="mypageStatusValue"><span class="pill" th:text="${additionalVerificationStatus}">UNREQUESTED</span></div>
            </article>
          </div>
        </section>

        <form class="mypageForm" action="account.html" th:object="${accountForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mypageFormGrid">
            <label class="mypageField">
              <span>ニックネーム</span>
              <input type="text" th:field="*{nickname}" />
            </label>
            <label class="mypageField">
              <span>氏名</span>
              <input type="text" th:field="*{name}" />
            </label>
            <label class="mypageField">
              <span>氏名カナ</span>
              <input type="text" th:field="*{nameKana}" />
            </label>
            <label class="mypageField">
              <span>生年月日</span>
              <input type="date" th:field="*{birthday}" />
            </label>
            <label class="mypageField">
              <span>性別</span>
              <select th:field="*{gender}">
                <option value="FEMALE">女性</option>
                <option value="MALE">男性</option>
                <option value="NO_ANSWER">回答しない</option>
              </select>
            </label>
            <label class="mypageField">
              <span>電話番号</span>
              <input type="tel" th:field="*{phoneNumber}" />
            </label>
            <label class="mypageField mypageField--full">
              <span>住所</span>
              <input type="text" th:field="*{address}" />
            </label>
          </div>
          <div class="mypageActions">
            <button class="btn primary" type="submit">保存する</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
