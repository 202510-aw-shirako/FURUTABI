<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>おかって申請 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="おかって申請">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="おかって申請ナビゲーション">
        <div class="mypageSidebarInner">
          <h2 class="mypageSidebarTitle">おかって申請</h2>
          <nav class="mypageNav">
            <a class="mypageNavLink" href="home.html">ホーム</a>
            <a class="mypageNavLink" href="okatte-list.html">ちいきのおかって</a>
            <a class="mypageNavLink is-current" th:href="@{/app/okatte/{id}/apply(id=${pageData.proposalId})}" aria-current="page">申請する</a>
          </nav>
        </div>
      </aside>

      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1">おかってへ申請する</h1>
          <p class="lead">候補を選んだうえで申請を作成する最小 backend 導線です。地域側判断と chat はまだ次段階です。</p>
        </div>

        <div class="card">
          <div class="h2" th:text="${pageData.title}">okatte title</div>
          <p class="note" th:if="${pageData.summary != null}" th:text="${pageData.summary}">summary</p>
          <p class="note" th:if="${pageData.locationName != null}" th:text="${'場所: ' + pageData.locationName}">場所</p>
          <p class="note" th:if="${pageData.durationMinutes != null}" th:text="${'所要時間: ' + pageData.durationMinutes + '分'}">所要時間</p>
          <p class="note" th:if="${pageData.hostNickname != null}" th:text="${'地域側: ' + pageData.hostNickname}">地域側</p>
          <p class="note" th:if="${pageData.bridgeNickname != null}" th:text="${'架け橋さん: ' + pageData.bridgeNickname}">架け橋さん</p>
          <p class="note" th:text="${'公開範囲: ' + pageData.visibilityLabel}">公開範囲</p>
        </div>

        <div class="mypageNoticeBox" th:if="${param.blocked}">
          <p>この候補には現在の状態では申請できません。表示された状態を確認してください。</p>
        </div>

        <div class="card" th:if="${pageData.blockingMessage != null}">
          <div class="h2">申請内容を確認してください</div>
          <p class="note" th:text="${pageData.blockingMessage}">blocking message</p>
          <p class="note" th:if="${pageData.existingApplicationStatus != null}"
             th:text="${'現在の申請状態: ' + pageData.existingApplicationStatus}">status</p>
          <div class="mypageActions">
            <a class="btn ghost" th:href="@{/app/okatte/{id}(id=${pageData.proposalId})}">候補詳細へ戻る</a>
            <a class="btn ghost" href="okatte-list.html">一覧へ戻る</a>
          </div>
        </div>

        <form class="mypageForm"
              th:if="${pageData.canSubmit}"
              th:action="@{/app/okatte/{id}/apply(id=${pageData.proposalId})}"
              th:object="${proposalApplicationForm}"
              method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mypageFormGrid">
            <label class="mypageField mypageField--full">
              <span>ひとことメモ</span>
              <textarea th:field="*{applicantMessage}" rows="6"
                        placeholder="選んだ理由や、伝えておきたいことを任意で残せます。長いやり取りや chat はまだ次段階です。"></textarea>
            </label>
          </div>

          <div class="mypageActions">
            <button class="btn primary" type="submit">申請を作成する</button>
            <a class="btn ghost" th:href="@{/app/okatte/{id}(id=${pageData.proposalId})}">候補詳細へ戻る</a>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
