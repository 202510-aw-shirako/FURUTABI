<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>関わりの記録 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="関わりの記録">
    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">関わりの記録</h1>
      </div>
      <p class="lead">
        <strong th:text="${pageData.currentUserLabel}">furutabi-user</strong>
        さんの proposal / 申請 / chat / 地図 / 足あと に関する最小の history を一覧します。
      </p>
      <div class="mypageNoticeBox" th:if="${pageData.items.isEmpty()}">
        <p>まだ一覧できる関わりの記録はありません。</p>
      </div>
    </section>

    <section class="section" th:if="${not #lists.isEmpty(pageData.items)}">
      <div class="grid2">
        <article class="card" th:each="item : ${pageData.items}">
          <div class="sectionTitleRow">
            <div>
              <span class="pill pill--soft" th:text="${item.label}">申請した</span>
              <h2 class="h2" th:text="${item.title}">title</h2>
            </div>
            <span class="pill" th:text="${item.kind}">CHAT</span>
          </div>
          <p class="lead" th:text="${item.summary}">summary</p>
          <p class="note" th:text="${item.occurredAt}">2026-03-27 10:00</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
            <a class="btn ghost" th:if="${item.relatedUrl != null}" th:href="${item.relatedUrl}">元の画面を見る</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
