<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gate 申請 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="gate 申請">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="gate 申請ナビゲーション">
        <div class="mypageSidebarInner">
          <h2 class="mypageSidebarTitle">gate 申請</h2>
          <nav class="mypageNav">
            <a class="mypageNavLink" href="home.html">ホーム</a>
            <a class="mypageNavLink" href="gate-list.html">ちいきの入り口</a>
            <a class="mypageNavLink is-current" th:href="@{/app/gate/{id}/apply(id=${pageData.proposalId})}" aria-current="page">申請する</a>
          </nav>
        </div>
      </aside>

      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1">gate へ申請する</h1>
          <p class="lead">今回は申請作成だけを backend 側につなぎます。承認判断や chat 開始はまだ次段階です。</p>
        </div>

        <div class="card">
          <div class="h2" th:text="${pageData.title}">gate title</div>
          <p class="note" th:if="${pageData.summary != null}" th:text="${pageData.summary}">summary</p>
          <p class="note" th:if="${pageData.locationName != null}" th:text="${'場所: ' + pageData.locationName}">場所</p>
          <p class="note" th:if="${pageData.durationMinutes != null}" th:text="${'所要時間: ' + pageData.durationMinutes + '分'}">所要時間</p>
          <p class="note" th:if="${pageData.hostNickname != null}" th:text="${'投稿者: ' + pageData.hostNickname}">投稿者</p>
          <p class="note" th:if="${pageData.bridgeNickname != null}" th:text="${'ブリッジ: ' + pageData.bridgeNickname}">ブリッジ</p>
          <p class="note" th:text="${'公開範囲: ' + pageData.visibilityLabel}">公開範囲</p>
        </div>

        <div class="mypageNoticeBox" th:if="${param.blocked}">
          <p>この gate には今の状態では申請できません。表示された条件を確認してください。</p>
        </div>

        <div class="card" th:if="${pageData.blockingMessage != null}">
          <div class="h2">この条件では申請できません</div>
          <p class="note" th:text="${pageData.blockingMessage}">blocking message</p>
          <p class="note" th:if="${pageData.existingApplicationStatus != null}"
             th:text="${'現在の申請状態: ' + pageData.existingApplicationStatus}">status</p>
          <div class="mypageActions">
            <a class="btn ghost" th:href="@{/app/gate/{id}(id=${pageData.proposalId})}">gate 詳細へ戻る</a>
            <a class="btn ghost" href="gate-list.html">一覧へ戻る</a>
          </div>
        </div>

        <form class="mypageForm"
              th:if="${pageData.canSubmit}"
              th:action="@{/app/gate/{id}/apply(id=${pageData.proposalId})}"
              th:object="${proposalApplicationForm}"
              method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mypageFormGrid">
            <label class="mypageField mypageField--full">
              <span>ひとことメモ</span>
              <textarea th:field="*{applicantMessage}" rows="6"
                        placeholder="参加してみたい理由や、当日に気になっていることを短く残せます。未入力でも申請できます。"></textarea>
            </label>
          </div>

          <div class="mypageActions">
            <button class="btn primary" type="submit">申請を作成する</button>
            <a class="btn ghost" th:href="@{/app/gate/{id}(id=${pageData.proposalId})}">gate 詳細へ戻る</a>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
