<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>わたしの地図の一覧で管理 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="わたしの地図の一覧で管理" data-my-map-record-list-page>
    <section class="section section--hero" aria-label="ヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHeroMap" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section">
      <div class="sectionTitleRow">
        <h1 class="h1">一覧で管理</h1>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <a class="btn ghost" href="home.html#tab-map">ホームの地図へ戻る</a>
        </div>
      </div>
      <p class="lead">ホーム地図で残した自分の記録を、一覧で見直すための補助管理面です。主な作成と編集は、地図上から行います。</p>
      <div class="mypageNoticeBox" th:if="${param.deleted}">
        <p>記録を一覧から外しました。</p>
      </div>
    </section>

    <section class="section">
      <div class="grid2" data-my-map-record-list-grid th:if="${not #lists.isEmpty(pageData.records)}">
        <article class="card" th:each="record, stat : ${pageData.records}">
          <div class="sectionTitleRow">
            <h2 class="h2" th:text="${record.title}">記録のタイトル</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <span class="pill" th:text="${record.visibilityLabel}">本人のみ</span>
            </div>
          </div>
          <p class="note" th:text="${'記録 ' + stat.count + (record.locationName != null ? ' / ' + record.locationName : '')}">記録 1</p>
          <p class="lead" th:text="${record.summary}">本文</p>
          <p class="note" th:text="${'リアクション: いいね ' + record.engagement.likeCount + ' / ありがとう ' + record.engagement.thanksCount}">リアクション: いいね 0 / ありがとう 0</p>
          <p class="note" th:text="${'コメント: ' + record.commentCount + '件'}">コメント: 0件</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
            <a class="btn ghost" th:href="@{/app/map-records/{id}(id=${record.id})}">詳細を見る</a>
            <a class="btn ghost" th:if="${record.owner}" th:href="@{/app/map-records/{id}/edit(id=${record.id})}">編集する</a>
          </div>
        </article>
      </div>
      <div class="card" th:if="${#lists.isEmpty(pageData.records)}">
        <div class="h2">まだ記録はありません</div>
        <p class="note">わたしの地図の空いている場所を押すと、新しい記録を残せます。</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
          <a class="btn primary" href="home.html#tab-map">わたしの地図から始める</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
