<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>プロフィール編集 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="プロフィール編集">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="マイページナビゲーション">
        <div class="mypageSidebarInner">
          <h2 class="mypageSidebarTitle">アカウント</h2>
          <nav class="mypageNav">
            <a class="mypageNavLink" href="mypage.html">マイページ</a>
            <a class="mypageNavLink" href="account.html">アカウント情報</a>
            <a class="mypageNavLink is-current" href="profile.html" aria-current="page">プロフィール編集</a>
            <a class="mypageNavLink" href="privacy-settings.html">公開範囲とプライバシー</a>
          </nav>
        </div>
      </aside>

      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1">プロフィール編集</h1>
          <p class="lead">register 後に「あとで設定」を選んだユーザーでも、ここから `user_profiles` を整え直せます。</p>
        </div>

        <div class="mypageNoticeBox" th:if="${param.saved}">
          <p>プロフィールを更新しました。</p>
        </div>

        <form class="mypageForm" action="profile.html" th:object="${profileForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mypageFormGrid">
            <label class="mypageField mypageField--full">
              <span>自己紹介</span>
              <textarea rows="4" th:field="*{bio}"></textarea>
            </label>
            <label class="mypageField">
              <span>年齢層</span>
              <select th:field="*{ageRange}">
                <option value="">選択してください</option>
                <option value="TEENS">10代</option>
                <option value="TWENTIES">20代</option>
                <option value="THIRTIES">30代</option>
                <option value="FORTIES">40代</option>
                <option value="FIFTIES">50代</option>
                <option value="SIXTIES_PLUS">60代以上</option>
              </select>
            </label>
            <label class="mypageField">
              <span>今いる地域</span>
              <input type="text" th:field="*{region}" />
            </label>
            <label class="mypageField">
              <span>興味のある地域</span>
              <input type="text" th:field="*{interestRegion}" />
            </label>
            <label class="mypageField mypageField--full">
              <span>訪問歴</span>
              <textarea rows="3" th:field="*{visitHistory}"></textarea>
            </label>
            <label class="mypageField mypageField--full">
              <span>配慮してほしいこと</span>
              <textarea rows="3" th:field="*{careNote}"></textarea>
            </label>
            <label class="mypageField">
              <span>子ども連れかどうか</span>
              <select th:field="*{withChildren}">
                <option value="">選択してください</option>
                <option value="WITH_CHILDREN">子ども連れ</option>
                <option value="WITHOUT_CHILDREN">子ども連れではない</option>
                <option value="UNSPECIFIED">状況による</option>
              </select>
            </label>
            <label class="mypageField">
              <span>食の配慮</span>
              <input type="text" th:field="*{foodNote}" />
            </label>
            <label class="mypageField mypageField--full">
              <span>関わり方メモ</span>
              <textarea rows="3" th:field="*{relationNote}"></textarea>
            </label>
          </div>
          <div class="mypageActions">
            <button class="btn primary" type="submit">保存する</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
