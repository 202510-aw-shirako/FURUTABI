<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>留意点一覧 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="留意点一覧">
    <section class="section fv">
      <div class="sectionTitleRow">
        <div>
          <h1 class="h1">留意点一覧</h1>
          <p class="lead" th:text="${pageData.targetUserLabel + ' さんに関する留意点を、本文に埋もれないよう先に確認できます。'}">留意点一覧</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="mypageNoticeBox" th:if="${#lists.isEmpty(pageData.items)}">
        <p>留意点の記載はまだありません。</p>
      </div>
      <div th:if="${not #lists.isEmpty(pageData.items)}" style="display:grid;gap:16px;">
        <article class="card" th:each="item : ${pageData.items}">
          <p style="white-space:pre-wrap;" th:text="${item.carePointsSummary}">留意点</p>
          <p class="note" th:text="${'作成: ' + item.createdByLabel + ' / ' + item.createdAt}">meta</p>
          <a class="btn ghost" th:href="${item.detailUrl}">この支援メモを見る</a>
        </article>
      </div>
    </section>

    <section class="section">
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <a class="btn ghost" th:href="${pageData.listUrl}">支援メモ一覧へ戻る</a>
        <a class="btn ghost" th:href="${pageData.adminDetailUrl}">管理者向けユーザー詳細へ戻る</a>
      </div>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
