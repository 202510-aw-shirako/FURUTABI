<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>パスワード変更 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar"><div class="container"><div class="inner"><div class="brand">FURUTABI｜郷旅</div><nav data-site-nav="app_home"></nav></div></div></header>
  <main class="container mypagePage" aria-label="パスワード変更">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="マイページナビゲーション"><div class="mypageSidebarInner"><h2 class="mypageSidebarTitle">アカウント</h2><nav class="mypageNav"><a class="mypageNavLink" href="./mypage.html">マイページ</a><a class="mypageNavLink" href="./account.html">アカウント情報</a><a class="mypageNavLink" href="./profile.html">プロフィール編集</a><a class="mypageNavLink" href="./privacy-settings.html">公開範囲とプライバシー</a><a class="mypageNavLink" href="./notifications.html">通知と連絡設定</a><a class="mypageNavLink" href="./history.html">関わりの履歴</a><a class="mypageNavLink is-current" href="./security.html" aria-current="page">ログインとセキュリティ</a><a class="mypageNavLink" href="./support.html">安心とサポート</a></nav></div></aside>
      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1">パスワード変更</h1>
          <p class="lead">現在のパスワードを確認したうえで、新しいパスワードに変更します。</p>
        </div>
        <section class="mypageSubflowCard">
          <form class="mypageForm" action="./password-change-complete.html">
            <label class="mypageField">
              <span>現在のパスワード</span>
              <input type="password" placeholder="現在のパスワードを入力" required />
            </label>
            <label class="mypageField">
              <span>新しいパスワード</span>
              <input type="password" placeholder="8文字以上で入力" required />
            </label>
            <label class="mypageField">
              <span>新しいパスワード（確認）</span>
              <input type="password" placeholder="もう一度入力" required />
            </label>
            <div class="mypageNoticeBox">
              <p>変更後は、新しいパスワードでログインします。</p>
              <p>見覚えのない変更に気づいた場合は、安心とサポートから非公開で知らせてください。</p>
            </div>
            <div class="mypageActions">
              <button class="btn primary" type="submit">変更する</button>
              <a class="btn ghost" href="./security.html">戻る</a>
            </div>
          </form>
        </section>
      </section>
    </section>
  </main>
  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
