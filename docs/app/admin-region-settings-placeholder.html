<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地域設定 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="地域設定 placeholder">
    <section class="section fv">
      <div class="sectionTitleRow">
        <div>
          <h1 class="h1">地域設定</h1>
          <p class="lead">この画面はまだ placeholder です。設定制度を広げず、現状の入口と戻り先だけを整理しています。</p>
        </div>
        <a class="btn ghost" href="admin-home.html">管理入口へ戻る</a>
      </div>
    </section>

    <section class="section">
      <article class="card">
        <h2 class="h2">現在の位置づけ</h2>
        <p th:text="${'対象地域: ' + (regionId == 'default' ? 'default（共通）' : regionId)}">対象地域: default</p>
        <p class="note">地域ごとの細かな設定はこの後の工程です。今回は placeholder であることを明示し、admin 面の中で迷わず戻れるようにしています。</p>
        <div class="chatComposerActions" style="margin-top:16px;">
          <a class="btn ghost" href="admin-user-list.html">ユーザー一覧へ</a>
          <a class="btn ghost" th:if="${fromUserId != null}" th:href="${fromUserDetailUrl}">対象ユーザーへ戻る</a>
        </div>
      </article>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
