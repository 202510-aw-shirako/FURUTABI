<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>連絡内容 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- 目印: チャットは単独の雑談部屋ではなく、提案 / 申請 / 相談などにひもづく前提 -->
  <!-- おすすめ: 相手・件名・状態・関連先を上に固定しておくと、いま何の話か迷いにくい -->
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="チャット" data-chat-page>
    <!-- 連絡一覧 / チャットは、一般的な雑談チャットではない -->
    <!-- 通知は「起きたことに気づく場」、こちらは「実際にやり取りする場」 -->
    <!-- チャットには必ず件名または紐づく対象を表示する -->
    <!-- 状態（申請中 / 承認 / 見送り など）が必ず見えるようにする -->
    <!-- 困りごとや改善点は公開ではなく、非公開導線へ送る -->
    <!-- 必要時は運営への相談導線を出す -->
    <!-- 追加確認が必要なときは、その状態を表示できるようにする -->
    <section class="chatShell">
      <div class="chatMain">
        <div class="mypageHead">
          <div class="messageBackLinks">
            <a href="./messages.html">一覧に戻る</a>
            <a href="../public/safety.html">困ったときは運営に相談</a>
          </div>
          <h1 class="h1">連絡内容</h1>
        </div>

        <section class="chatThreadHeader">
          <div class="chatThreadMeta">
            <span class="pill" data-chat-role>架け橋さん</span>
            <span class="pill pill--soft" data-chat-status>承認</span>
          </div>
          <h2 class="h2" data-chat-counterpart>長谷川 虹翔さん</h2>
          <div class="chatThreadTitle" data-chat-title>郷土料理をみんなで作る午後</div>
          <div class="chatThreadActions">
            <a class="btn ghost" href="#" data-chat-related-link>この件の詳細を見る</a>
            <a class="btn ghost" href="../public/safety.html">困ったときは運営に相談</a>
          </div>
        </section>

        <div class="chatAlert" hidden data-chat-closed>
          <div class="h2">このやり取りは終了しました</div>
          <p class="note">必要がある場合は、運営への相談導線から非公開で知らせられます。</p>
        </div>

        <div class="chatAlert" hidden data-chat-verify>
          <div class="h2">追加確認が必要です</div>
          <p class="note">本人確認ページに進んだあと、必要に応じてこのやり取りを再開できます。</p>
          <a class="btn ghost" href="../auth/register-verify.html">本人確認ページへ</a>
        </div>

        <section class="chatMessages" data-chat-messages></section>

        <section class="chatComposer" data-chat-composer>
          <label class="mypageField">
            <span>メッセージ</span>
            <textarea rows="4" placeholder="この件について、必要なことだけを落ち着いて送れます。"></textarea>
          </label>
          <div class="chatComposerActions">
            <a class="btn ghost" href="../public/safety.html">困ったときは運営に相談</a>
            <button class="btn primary" type="button">送信する</button>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="../public/assets/scripts/shared-ui.js"></script>
  <script src="../public/assets/scripts/messages.js"></script>
</body>
</html>
