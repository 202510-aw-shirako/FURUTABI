<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>通知 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="通知">
    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">通知</h1>
        <span class="pill pill--soft" th:text="'未読 ' + ${pageData.unreadCount} + ' 件'">未読 0 件</span>
      </div>
      <p class="lead">起きたことに気づくための最小通知一覧です。詳細なやり取りや判断は、元の proposal / chat / 地図画面で行います。</p>
      <div class="mypageNoticeBox" th:if="${pageData.items.isEmpty()}">
        <p>まだ通知はありません。</p>
      </div>
    </section>

    <section class="section" th:if="${not #lists.isEmpty(pageData.items)}">
      <div class="grid2">
        <article class="card" th:each="item : ${pageData.items}">
          <div class="sectionTitleRow">
            <div>
              <span class="pill pill--soft" th:text="${item.kindLabel}">通知</span>
              <h2 class="h2" th:text="${item.title}">title</h2>
            </div>
            <span class="pill" th:text="${item.unread} ? '未読' : '既読'">未読</span>
          </div>
          <p class="lead" th:if="${item.body != null}" th:text="${item.body}">body</p>
          <p class="note" th:if="${item.senderName != null}">
            <span th:text="${item.senderName}">sender</span>
            <span th:if="${item.senderRole != null}" th:text="' / ' + ${item.senderRole}"> / USER</span>
          </p>
          <p class="note" th:text="${item.createdAt}">2026.03.27 10:00</p>
          <p class="note" th:if="${item.previewText != null}" th:text="${item.previewText}">preview</p>
          <form th:action="@{/app/notifications/{id}/open(id=${item.notificationId})}" method="post" style="margin-top:16px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn ghost" type="submit" th:text="${item.actionLabel} ?: '詳細を見る'">詳細を見る</button>
          </form>
        </article>
      </div>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
