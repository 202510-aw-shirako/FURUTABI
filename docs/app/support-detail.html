<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>お問い合わせ詳細 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container safetyPage" aria-label="お問い合わせ詳細">
    <section class="section safetyIntroSection" aria-label="詳細の導入">
      <div class="safetyIntroLayout">
        <div class="safetyIntro">
          <h1 class="safetyTitle">お問い合わせ詳細</h1>
          <p class="safetyLead">
            送った内容と現在の状態をここで確認できます。<br>
            ログイン後のお問い合わせは非公開で扱われ、一覧と詳細で追えます。
          </p>
        </div>
        <div class="safetyAssistPanel" aria-label="導線">
          <p class="safetyAssistTitle">移動する</p>
          <div class="safetyFeatureLinks">
            <a class="safetyFeatureLink" href="support-list.html">お問い合わせ一覧・詳細へ戻る</a>
            <a class="safetyFeatureLink" th:if="${pageData.adminView}" href="app/support/admin">管理一覧へ戻る</a>
          </div>
        </div>
      </div>
    </section>

    <section class="section safetyWhatSection" aria-label="状態">
      <div class="safetyWhatGrid">
        <article class="safetyWhatCard">
          <h3 class="h2">種類</h3>
          <p class="note" th:text="${pageData.typeLabel}">一般</p>
        </article>
        <article class="safetyWhatCard">
          <h3 class="h2">状態</h3>
          <p class="note" th:text="${pageData.statusLabel}">受付</p>
        </article>
        <article class="safetyWhatCard">
          <h3 class="h2">返信について</h3>
          <p class="note" th:text="${pageData.replyPreferenceLabel}">どちらでもよい</p>
        </article>
      </div>
    </section>

    <section class="section safetyFormSection" aria-label="内容">
      <article class="safetyFormCard">
        <div class="safetySectionHead">
          <h2 class="h2">送信内容</h2>
        </div>

        <div class="safetyField">
          <label class="safetyLabel">送信日時</label>
          <p class="note" th:text="${pageData.createdAt}">2026.03.27 10:00</p>
        </div>

        <div class="safetyField" th:if="${pageData.updatedAt != null}">
          <label class="safetyLabel">更新日時</label>
          <p class="note" th:text="${pageData.updatedAt}">2026.03.27 11:00</p>
        </div>

        <div class="safetyField">
          <label class="safetyLabel">関係する機能</label>
          <p class="note" th:text="${pageData.relatedFeature} ?: '未設定'">未設定</p>
        </div>

        <div class="safetyField">
          <label class="safetyLabel">対象URL / ID</label>
          <p class="note" th:text="${pageData.targetReference} ?: '未設定'">未設定</p>
        </div>

        <div class="safetyField" th:if="${pageData.adminView}">
          <label class="safetyLabel">送信者</label>
          <p class="note" th:text="${pageData.requesterLabel} ?: '表示対象なし'">表示対象なし</p>
        </div>

        <div class="safetyField" th:if="${pageData.adminView and pageData.handlerLabel != null}">
          <label class="safetyLabel">対応者</label>
          <p class="note" th:text="${pageData.handlerLabel}">対応者</p>
        </div>

        <div class="mypageNoticeBox" style="margin-top:16px;">
          <p th:text="${pageData.body}">body</p>
        </div>

        <div class="safetySubmitArea">
          <a class="btn ghost" href="support-list.html">お問い合わせ一覧・詳細へ戻る</a>
          <a class="btn ghost"
             th:if="${pageData.adminView and pageData.adminChatReviewEntryUrl != null}"
             th:href="${pageData.adminChatReviewEntryUrl}">関係チャットを確認する</a>

          <form th:if="${pageData.canMarkHandled}" th:action="@{/app/support/{id}/handle(id=${pageData.supportRequestId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn ghost" type="submit">対応中にする</button>
          </form>

          <form th:if="${pageData.canClose}" th:action="@{/app/support/{id}/close(id=${pageData.supportRequestId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn ghost" type="submit">完了にする</button>
          </form>
        </div>
      </article>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
