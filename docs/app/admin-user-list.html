<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="furutabi-export-target" content="docs" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理ユーザー一覧 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="管理ユーザー一覧">
    <section class="section fv">
      <div class="sectionTitleRow">
        <div>
          <h1 class="h1">管理ユーザー一覧</h1>
          <p class="lead">表示名、メール、user ID で対象を探し、ユーザー詳細で role / permission / assignment / ポイント / 監査ログを確認します。</p>
          <p class="note" th:text="${'表示 ' + pageData.shownCount + ' / 検索一致 ' + pageData.matchedCount + ' / 全体 ' + pageData.totalUserCount}">表示 0 / 検索一致 0 / 全体 0</p>
        </div>
        <a class="btn ghost" href="admin-home.html">管理入口へ戻る</a>
      </div>
    </section>

    <section class="section">
      <article class="card">
        <form method="get" action="admin-user-list.html" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
          <label style="flex:1 1 320px;">
            <span class="note">検索</span>
            <input type="text" name="q" th:value="${pageData.query}" placeholder="表示名 / メール / user#ID" />
          </label>
          <button class="btn" type="submit">検索</button>
          <a class="btn ghost" href="admin-user-list.html">解除</a>
        </form>
      </article>
    </section>

    <section class="section">
      <article class="card">
        <div style="overflow:auto;">
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr>
                <th style="text-align:left;padding:10px 8px;">ユーザー</th>
                <th style="text-align:left;padding:10px 8px;">メール</th>
                <th style="text-align:left;padding:10px 8px;">役割</th>
                <th style="text-align:left;padding:10px 8px;">状態</th>
                <th style="text-align:left;padding:10px 8px;">地域</th>
                <th style="text-align:left;padding:10px 8px;">詳細</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(pageData.users)}">
                <td colspan="6" style="padding:16px 8px;">一致するユーザーはありません。</td>
              </tr>
              <tr th:each="userItem : ${pageData.users}">
                <td style="padding:10px 8px;">
                  <strong th:text="${userItem.displayName}">display</strong>
                  <div class="note" th:text="${'user#' + userItem.userId}">user#1</div>
                </td>
                <td style="padding:10px 8px;" th:text="${userItem.email}">user@example.com</td>
                <td style="padding:10px 8px;">
                  <strong th:text="${userItem.roleLabel}">一般ユーザー</strong>
                  <div class="note" th:text="${userItem.roleName}">USER</div>
                </td>
                <td style="padding:10px 8px;"
                    th:text="${userItem.roleState == 'active' ? '有効' : (userItem.roleState == 'suspended' ? '停止中' : (userItem.roleState == 'revoked' ? '取り下げ' : userItem.roleState))}">
                  有効
                </td>
                <td style="padding:10px 8px;" th:text="${userItem.regionId == 'default' ? 'default（共通）' : userItem.regionId}">default</td>
                <td style="padding:10px 8px;">
                  <a th:href="${userItem.detailUrl}">管理詳細へ</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
