<!doctype html>
<html lang="ja">

  <title>FURUTABI Wire | お知らせ</title>
  <link rel="stylesheet" href="../css/style.css" />

<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav>
          <a href="index.html">トップ</a>
          <a href="about.html">私たちの目指すもの</a>

          <a href="../auth/login.html">ログイン</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="お知らせ一覧">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>

    </section>

    <section class="section fv">
      <h1 class="h1">お知らせ</h1>
      <p class="lead">この場所の運用や案内の更新を、静かにまとめています。</p>

    <section class="section">
      <!-- TODO: 本実装時は CMS / API の一覧レスポンスでこのリストを置き換える -->
      <div class="noticeList" data-notice-list-items data-notice-base=""></div>
    </section>

    <section class="section">
      <!-- TODO: 観光協会サイトの正式URL確定後、ここに外部リンクを設定 -->
      <div class="noticeExternalPlaceholder">
        <div>
          <div class="h2">地域全体の観光情報について</div>
          <p class="note">催し・営業時間・広域案内などの総合情報は、観光協会サイトへの導線をここに差し込む想定です。</p>
        </div>
        <span class="noticeExternalBadge">外部リンク想定</span>
      </div>
    </section>
  </main>

  <script src="./assets/scripts/notices.js"></script>
