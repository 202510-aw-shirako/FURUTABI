<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FURUTABI Wire | Safety</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="public_secondary"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="安心と連絡">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <h1 class="h1">安心と連絡</h1>
      <p class="lead">公開の場は空気を守る。困りごと・改善提案は非公開で届く。</p>
    </section>

    <section class="section">
      <div class="grid2">
        <div class="card">
          <div class="h2">非公開で連絡</div>
          <div class="ph ph--line w-90"></div>
          <div class="ph ph--line w-80"></div>
          <div class="ph ph--line w-70"></div>
          <a class="btn primary" href="#">送信（ワイヤ）</a>
        </div>
        <div class="card">
          <div class="h2">通報・削除</div>
          <div class="ph ph--line w-90"></div>
          <div class="ph ph--line w-60"></div>
          <div class="ph ph--line w-80"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="./assets/scripts/shared-ui.js"></script>
</body>
</html>
