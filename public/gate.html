<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FURUTABI Wire | ちいきの入り口</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="public_gate"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ちいきの入り口">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">ちいきの入り口</h1>
        <a class="sectionTitleLink" href="about.html#feature-gate">ご説明</a>
      </div>
      <p class="lead">登録後はまずここで、実際にどんな関わり方が合いそうかを静かに選びます。</p>
    </section>

    <section class="section">
      <div class="card">
        <div class="h2">ここからの流れ</div>
        <ul class="aboutFeatureList" data-rule-list="gate"></ul>
      </div>
    </section>

    <section class="section" aria-label="入口カード">
      <div class="sectionTitleRow">
        <h2 class="h2">入口カード</h2>
      </div>
      <p class="lead">気になる入口を見つけたら、ここから先の関わり方を決めていきます。</p>

      <div class="entryCarousel" aria-label="入口カード" data-entry-carousel style="margin-top:16px;">
        <div class="entryCarouselStage">
          <button class="btn ghost entryCarouselArrow entryCarouselArrow--prev" type="button" data-entry-prev aria-label="前の入口カード"></button>
          <div class="entryCarouselViewport">
            <div class="entryCarouselTrack" data-entry-track data-proposal-list="gate" data-proposal-base="./" data-proposal-context="gate"></div>
          </div>
          <button class="btn ghost entryCarouselArrow entryCarouselArrow--next" type="button" data-entry-next aria-label="次の入口カード"></button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="denseBox">
        <div>
          <div class="h2">つなぎ手の登録後</div>
          <p class="note">ワイヤ: 地域の人と実際に会い、つなぎ手が登録したあとに通常のログイン後ホームへ進みます。</p>
        </div>
        <a class="btn primary" href="../app/home.html">通常のログイン後画面へ</a>
      </div>
    </section>
  </main>

  <script src="./assets/scripts/shared-ui.js"></script>
  <script src="./assets/scripts/proposals.js"></script>
  <script src="./assets/scripts/entry-carousel.js"></script>
</body>
</html>
