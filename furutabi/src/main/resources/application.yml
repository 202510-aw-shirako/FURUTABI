spring:
  application:
    name: furutabi
  thymeleaf:
    cache: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  servlet:
    session:
      timeout: 30m

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.furutabi
  configuration:
    map-underscore-to-camel-case: true

app:
  file-storage:
    provider: local
  timezone:
    display: Asia/Tokyo
  sms:
    enabled: false
  identity-verification:
    enabled: false

logging:
  level:
    root: info
