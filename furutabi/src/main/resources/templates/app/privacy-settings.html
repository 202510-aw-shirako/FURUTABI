<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>公開範囲とプライバシー | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="公開範囲とプライバシー">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="マイページナビゲーション">
        <div class="mypageSidebarInner">
          <h2 class="mypageSidebarTitle">アカウント</h2>
          <nav class="mypageNav">
            <a class="mypageNavLink" href="/app/mypage">マイページ</a>
            <a class="mypageNavLink" href="/app/account">アカウント情報</a>
            <a class="mypageNavLink" href="/app/profile">プロフィール編集</a>
            <a class="mypageNavLink is-current" href="/app/privacy-settings" aria-current="page">公開範囲とプライバシー</a>
          </nav>
        </div>
      </aside>

      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1">公開範囲とプライバシー</h1>
          <p class="lead">今回ここで扱うのは `contact_preferences` の最小更新です。visibility や関係者判定の完成仕様は次段階に残します。</p>
        </div>

        <div class="mypageNoticeBox" th:if="${param.saved}">
          <p>公開範囲とプライバシー設定を更新しました。</p>
        </div>

        <section class="mypageSection">
          <div class="sectionTitleRow">
            <h2 class="h2">現在の認証状態</h2>
          </div>
          <div class="mypageStatusGrid">
            <article class="mypageStatusCard">
              <p class="mypageStatusLabel">SMS認証</p>
              <div class="mypageStatusValue"><span class="pill pill--soft" th:text="${smsVerified} ? '認証済み' : '未認証'">認証済み</span></div>
            </article>
            <article class="mypageStatusCard">
              <p class="mypageStatusLabel">追加本人確認</p>
              <div class="mypageStatusValue"><span class="pill" th:text="${additionalVerificationStatus}">UNREQUESTED</span></div>
            </article>
          </div>
        </section>

        <form class="mypageForm" th:action="@{/app/privacy-settings}" th:object="${privacySettingsForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mypageFormGrid">
            <div class="mypageField mypageField--full">
              <span>通知・連絡設定</span>
              <div class="mypageCheckStack">
                <label><input type="checkbox" th:field="*{receiveOperationNotice}" />運営からのお知らせを受け取る</label>
                <label><input type="checkbox" th:field="*{receiveSecurityNotice}" />セキュリティ連絡を受け取る</label>
                <label><input type="checkbox" th:field="*{receiveBridgeContact}" />Bridge からの連絡を受け取る</label>
                <label><input type="checkbox" th:field="*{receiveLocalContact}" />Local からの連絡を受け取る</label>
                <label><input type="checkbox" th:field="*{receiveEmailNotice}" />メール通知を受け取る</label>
                <label><input type="checkbox" th:field="*{receiveSmsNotice}" />SMS 通知を受け取る</label>
              </div>
            </div>
          </div>
          <div class="mypageActions">
            <button class="btn primary" type="submit">保存する</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
