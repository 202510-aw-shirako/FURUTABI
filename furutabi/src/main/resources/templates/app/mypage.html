<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>マイページ | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container authPage" aria-label="マイページ">
    <section class="authFlowShell">
      <div class="authFlowIntro">
        <p class="eyebrow">MY PAGE</p>
        <h1 class="authFlowTitle">プロフィールをあとから整える受け先です</h1>
        <p class="authFlowLead">register の「あとで設定」導線は、ここへ着地する前提でつないでいます。プロフィールや設定の詳細ページは次段階で本実装します。</p>
      </div>

      <section class="authCard">
        <div class="authForm">
          <div class="authField">
            <label>この段階で分かること</label>
            <p>プロフィールを未入力のまま進んだ場合でも、あとで設定し直せる受け先は backend 側にあります。まだ account / profile / privacy-settings の詳細 route まではつないでいません。</p>
          </div>
          <div class="authFormActions">
            <a class="btn primary" href="/app/home">ホームへ進む</a>
            <a class="btn ghost" href="/login">ログイン画面へ戻る</a>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
