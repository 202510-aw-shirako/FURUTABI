<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title th:text="${pageData.pageTitle} + ' | FURUTABI'">わたしの地図の記録フォーム | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container mypagePage" aria-label="わたしの地図の記録フォーム">
    <section class="mypageShell">
      <aside class="mypageSidebar" aria-label="地図の記録ナビゲーション">
        <div class="mypageSidebarInner">
          <h2 class="mypageSidebarTitle">わたしの地図</h2>
          <nav class="mypageNav">
            <a class="mypageNavLink" href="/app/home">ホーム</a>
            <a class="mypageNavLink" href="/app/mypage">マイページ</a>
            <a class="mypageNavLink is-current" href="/app/map-records" aria-current="page">わたしの地図の記録</a>
          </nav>
        </div>
      </aside>

      <section class="mypageMain">
        <div class="mypageHead">
          <h1 class="h1" th:text="${pageData.pageTitle}">わたしの地図の記録を追加</h1>
          <p class="lead" th:text="${pageData.leadText}">記録の最小フォームです。</p>
        </div>

        <div class="mypageNoticeBox" th:if="${param.savedDraft}">
          <p>下書きとして保存しました。公開すると一覧と詳細から見られるようになります。</p>
        </div>

        <form class="mypageForm" th:action="${pageData.submitPath}" th:object="${mapRecordForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mypageFormGrid">
            <label class="mypageField mypageField--full">
              <span>タイトル</span>
              <input type="text" th:field="*{title}" placeholder="旅の記録に残したい見出し" />
            </label>
            <label class="mypageField mypageField--full">
              <span>場所メモ</span>
              <input type="text" th:field="*{locationName}" placeholder="鎌倉 / 境内 / 商店街など" />
            </label>
            <label class="mypageField">
              <span>公開設定</span>
              <select th:field="*{visibility}">
                <option th:each="option : ${visibilityOptions}" th:value="${option.value}" th:text="${option.label}">本人のみ</option>
              </select>
            </label>
            <label class="mypageField">
              <span>位置精度</span>
              <select th:field="*{locationPrecisionLevel}">
                <option value="area">area</option>
                <option value="town">town</option>
                <option value="point">point</option>
              </select>
            </label>
            <label class="mypageField mypageField--full">
              <span>本文</span>
              <textarea th:field="*{body}" rows="8" placeholder="旅先で見たもの、感じたこと、残しておきたい時間を書けます。"></textarea>
            </label>
          </div>

          <label class="mypageField" style="margin-top:16px;display:flex;gap:8px;align-items:center;">
            <input type="checkbox" th:field="*{draft}" />
            <span>下書きとして保存する</span>
          </label>

          <div class="mypageActions">
            <button class="btn primary" type="submit" th:text="${pageData.editing} ? '更新する' : '保存する'">保存する</button>
            <a class="btn ghost" href="/app/map-records">一覧へ戻る</a>
            <a class="btn ghost" th:if="${pageData.editing}" th:href="@{/app/map-records/{id}(id=${pageData.recordId})}">詳細を見る</a>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
