<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>サポート | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="サポート">
    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1" th:text="${pageData.adminView} ? 'サポート確認' : 'サポート'">サポート</h1>
        <a class="btn ghost" th:if="${not pageData.adminView}" href="/app/support/new">相談を送る</a>
      </div>
      <p class="lead" th:if="${not pageData.adminView}">
        公開 comments や chat に流さず、非公開で運用へ連絡したい内容はこちらから送れます。
      </p>
      <p class="lead" th:if="${pageData.adminView}">
        運用側が確認する最小の非公開窓口一覧です。通常表示は薄く保ち、必要時だけ詳細を開きます。
      </p>
      <div class="mypageNoticeBox" th:if="${pageData.items.isEmpty()}">
        <p th:text="${pageData.adminView} ? 'まだ support はありません。' : 'まだ support はありません。必要な時だけ非公開で連絡できます。'">まだ support はありません。</p>
      </div>
    </section>

    <section class="section" th:if="${not #lists.isEmpty(pageData.items)}">
      <div class="grid2">
        <article class="card" th:each="item : ${pageData.items}">
          <div class="sectionTitleRow">
            <div>
              <span class="pill pill--soft" th:text="${item.typeLabel}">サポート</span>
              <h2 class="h2" th:text="${item.summary}">summary</h2>
            </div>
            <span class="pill" th:text="${item.statusLabel}">受付</span>
          </div>
          <p class="note" th:text="${item.createdAt}">2026.03.27 10:00</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
            <a class="btn ghost" th:href="${item.detailUrl}">詳細を見る</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
