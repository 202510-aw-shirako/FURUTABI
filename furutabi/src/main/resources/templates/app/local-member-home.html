<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>地域ユーザーホーム | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_local_member"></nav>
      </div>
    </div>
  </header>

  <main class="container authPage" aria-label="地域ユーザー向けホーム">
    <section class="authFlowShell">
      <div class="authFlowIntro">
        <p class="eyebrow">LOCAL HOME</p>
        <h1 class="authFlowTitle">地域ユーザー向けホームの受け先を置いています</h1>
        <p class="authFlowLead">ここは LOCAL / BRIDGE 系の既定遷移を、preview 公開ページ以外にも受けられるようにするための最小 route です。本格的な中身は次段階で接続します。</p>
      </div>

      <section class="authCard">
        <div class="authForm">
          <div class="authField">
            <label>この段階で分かること</label>
            <p>地域ユーザー向けの受け先 route は backend 側にあります。公開ページや認可の細部はまだ固定していません。</p>
          </div>
          <div class="authFormActions">
            <a class="btn primary" href="/app/mypage">マイページを見る</a>
            <a class="btn ghost" href="/preview/public/bridge.html">preview 地域ページへ戻る</a>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
