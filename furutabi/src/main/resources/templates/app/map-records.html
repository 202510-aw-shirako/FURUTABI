<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>わたしの地図の記録 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="わたしの地図の記録一覧">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section">
      <div class="sectionTitleRow">
        <h1 class="h1">わたしの地図の記録</h1>
        <a class="sectionTitleLink" href="/app/home#tab-map">ホームの地図へ戻る</a>
      </div>
      <p class="lead">
        <strong th:text="${pageData.currentUserLabel}">furutabi-user</strong>
        さんが公開済みで残している記録を、backend 側の一覧として見返せるようにしたページです。
      </p>
    </section>

    <section class="section">
      <div class="grid2" th:if="${not #lists.isEmpty(pageData.records)}">
        <article class="card" th:each="record : ${pageData.records}">
          <div class="sectionTitleRow">
            <h2 class="h2" th:text="${record.title}">記録タイトル</h2>
            <span class="pill" th:text="${record.visibilityLabel}">本人のみ</span>
          </div>
          <p class="note">
            <span th:text="${record.locationName} ?: '場所メモはまだありません'">鎌倉</span>
            <span th:if="${record.createdAt != null}" th:text="' / ' + ${record.createdAt}"> / 2026.03.25</span>
          </p>
          <p class="lead" th:text="${record.summary}">記録の要約</p>
          <div class="sectionTitleRow" style="margin-top:12px;">
            <span class="note" th:text="'写真 ' + ${record.imageCount} + '枚'">写真 0枚</span>
            <span class="note" th:text="'コメント ' + ${record.commentCount} + '件'">コメント 0件</span>
          </div>
          <a class="btn ghost" th:href="@{/app/map-records/{id}(id=${record.id})}">詳細を読む</a>
        </article>
      </div>

      <div class="card" th:if="${#lists.isEmpty(pageData.records)}">
        <div class="h2">まだ公開済みの記録はありません</div>
        <p class="note">投稿・編集・削除は次段階です。このページでは、すでに残っている記録の一覧と詳細だけを見られます。</p>
        <a class="btn ghost" href="/app/home#tab-map">ホームの地図へ戻る</a>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
