<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>わたしの地図の一覧で管理 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="わたしの地図の一覧で管理" data-my-map-record-list-page>
    <section class="section">
      <div class="sectionTitleRow">
        <h1 class="h1">一覧で管理</h1>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <a class="btn ghost" href="/app/home#tab-map">ホームの地図へ戻る</a>
        </div>
      </div>
      <p class="lead">ホーム地図で残した自分の記録を、一覧で見直すための補助管理面です。主な作成と編集は地図上から行います。</p>
      <div class="mypageNoticeBox" th:if="${param.deleted}">
        <p>記録を一覧から外しました。</p>
      </div>
    </section>

    <section class="section">
      <div class="grid2" data-my-map-record-list-grid></div>
      <div class="card" data-my-map-record-list-empty hidden>
        <div class="h2">まだ記録はありません</div>
        <p class="note">ホーム地図の空き位置を押すと、新しい記録を残せます。</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
          <a class="btn primary" href="/app/home#tab-map">ホームの地図から始める</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
  <script src="/assets/scripts/interactions.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-my-map-record-list-page]');
      var interactions = window.FURUTABI_INTERACTIONS;
      var grid;
      var empty;
      var typeLabels = {
        stop: '立ち寄り',
        meal: '食事',
        scenery: '景色',
        stay: '滞在',
        experience: '体験',
        memo: 'メモ'
      };
      var seasonLabels = {
        spring: '春',
        summer: '夏',
        autumn: '秋',
        winter: '冬',
        all: 'いつでも'
      };

      if (!root || !interactions) {
        return;
      }

      grid = root.querySelector('[data-my-map-record-list-grid]');
      empty = root.querySelector('[data-my-map-record-list-empty]');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function visibilityMeta(value) {
        if (value === 'limited') {
          return '地域の方まで';
        }
        if (value === 'public') {
          return '一般に公開';
        }
        return '本人のみ';
      }

      function facetText(record) {
        var parts = [];
        if (record.recordedYear) {
          parts.push(record.recordedYear === 'earlier' ? 'それ以前' : record.recordedYear + '年');
        }
        parts.push(seasonLabels[record.season] || seasonLabels.all);
        parts.push(typeLabels[record.recordType] || typeLabels.stop);
        return parts.join(' / ');
      }

      function render() {
        var records = interactions.getMapRecords()
          .filter(function (record) {
            return record && record.registered;
          })
          .sort(function (a, b) {
            return new Date(b.recordedAt || 0).getTime() - new Date(a.recordedAt || 0).getTime();
          });

        if (!records.length) {
          grid.innerHTML = '';
          empty.hidden = false;
          return;
        }

        empty.hidden = true;
        grid.innerHTML = records.map(function (record, index) {
          var stateLabel = record.isDraft ? '下書き' : '公開中';
          var detailHref = '/app/my-map-records/' + encodeURIComponent(record.id);
          var editHref = '/app/home?editPin=' + encodeURIComponent(record.id) + '#tab-map';

          return [
            '<article class="card">',
            '  <div class="sectionTitleRow">',
            '    <h2 class="h2">' + escapeHtml(record.title || 'タイトル未設定') + '</h2>',
            '    <div style="display:flex;gap:8px;flex-wrap:wrap;">',
            '      <span class="pill">' + escapeHtml(stateLabel) + '</span>',
            '      <span class="pill">' + escapeHtml(visibilityMeta(record.visibility)) + '</span>',
            '    </div>',
            '  </div>',
            '  <p class="note">記録 ' + String(index + 1) + ' / ' + escapeHtml(facetText(record)) + '</p>',
            '  <p class="note">' + escapeHtml(record.locationName || '地図上で選んだ位置') + (record.recordedAt ? ' / ' + escapeHtml(record.recordedAt) : '') + '</p>',
            '  <p class="lead">' + escapeHtml(record.body || 'まだ本文は入っていません。') + '</p>',
            '  <p class="note">コメントはごひいきさんの足あと側で反映されます。</p>',
            '  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">',
            '    <a class="btn ghost" href="' + detailHref + '">詳細を見る</a>',
            '    <a class="btn ghost" href="' + editHref + '">ホーム地図で編集</a>',
            '  </div>',
            '</article>'
          ].join('');
        }).join('');
      }

      render();
    })();
  </script>
</body>
</html>
