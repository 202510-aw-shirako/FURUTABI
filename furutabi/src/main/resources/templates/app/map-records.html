<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>わたしの地図の記録 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="わたしの地図の記録一覧">
    <section class="section section--hero" aria-label="ページ案内">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section">
      <div class="sectionTitleRow">
        <h1 class="h1">わたしの地図の記録</h1>
        <div style="display:flex;gap:12px;align-items:center;">
          <a class="sectionTitleLink" href="/app/home#tab-map">ホームの地図へ戻る</a>
          <a class="btn primary" href="/app/map-records/new">新しい記録を追加</a>
        </div>
      </div>
      <p class="lead">
        <strong th:text="${pageData.currentUserLabel}">furutabi-user</strong>
        さんから見えている「わたしの地図の記録」を一覧で見られるページです。オーナーの記録はここから編集できます。
      </p>
      <div class="mypageNoticeBox" th:if="${param.deleted}">
        <p>記録を一覧から外しました。</p>
      </div>
    </section>

    <section class="section">
      <div class="grid2" th:if="${not #lists.isEmpty(pageData.records)}">
        <article class="card" th:each="record : ${pageData.records}">
          <div class="sectionTitleRow">
            <h2 class="h2" th:text="${record.title}">記録タイトル</h2>
            <span class="pill" th:text="${record.visibilityLabel}">本人のみ</span>
          </div>
          <p class="note">
            <span th:text="${record.locationName} ?: '場所メモはまだありません'">場所メモ</span>
            <span th:if="${record.createdAt != null}" th:text="' / ' + ${record.createdAt}"> / 2026.03.25</span>
          </p>
          <p class="lead" th:text="${record.summary}">記録の要約</p>
          <p class="note" th:text="'投稿者: ' + ${record.ownerDisplayName}">投稿者: furutabi-user</p>
          <div class="sectionTitleRow" style="margin-top:12px;">
            <span class="note" th:text="'画像 ' + ${record.imageCount} + '枚'">画像 0枚</span>
            <span class="note" th:text="'コメント ' + ${record.commentCount} + '件'">コメント 0件</span>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
            <a class="btn ghost" th:href="@{/app/map-records/{id}(id=${record.id})}">詳細を読む</a>
            <a class="btn ghost" th:if="${record.owner}" th:href="@{/app/map-records/{id}/edit(id=${record.id})}">編集する</a>
          </div>
        </article>
      </div>

      <div class="card" th:if="${#lists.isEmpty(pageData.records)}">
        <div class="h2">まだ見える地図の記録はありません</div>
        <p class="note">公開済みの記録や、自分で作成した記録がここに並びます。まずは最初の記録を追加できます。</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
          <a class="btn primary" href="/app/map-records/new">最初の記録を追加</a>
          <a class="btn ghost" href="/app/home#tab-map">ホームの地図へ戻る</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
