<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>主催者申請一覧 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_local_member"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="主催者向け申請一覧">
    <section class="section section--hero" aria-label="ページヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">主催者申請一覧</h1>
        <a class="sectionTitleLink" href="/app/local-member-home">ホームへ戻る</a>
      </div>
      <p class="lead">自分が主催者の proposal に届いた pending 申請を確認できます。承認と拒否は詳細画面から行います。</p>
    </section>

    <section class="section">
      <div class="grid2" style="margin-top:16px;" th:if="${!pageData.items.isEmpty()}">
        <article class="card" th:each="item : ${pageData.items}">
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:center;">
            <span class="pill" th:text="${item.applicationStatus}">pending</span>
            <span class="note"
                  th:text="${item.durationMinutes != null ? item.durationMinutes + '分' : '所要時間は次段階で設定'}">60分</span>
          </div>
          <h2 class="h2" th:text="${item.title}">proposal title</h2>
          <p class="note" th:text="${'申請者: ' + item.applicantNickname}">申請者</p>
          <p class="note" th:text="${'主催者: ' + item.hostNickname}">主催者</p>
          <p class="note" th:if="${item.locationName != null}" th:text="${'場所: ' + item.locationName}">場所</p>
          <p class="note" th:if="${item.latestMessagePreview != null}" th:text="${item.latestMessagePreview}">メモ</p>
          <p class="note" th:if="${item.appliedAt != null}"
             th:text="${'申請日時: ' + #temporals.format(item.appliedAt, 'yyyy-MM-dd HH:mm')}">申請日時</p>
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
            <a class="btn primary" th:href="@{/app/host-applications/{id}(id=${item.applicationId})}">詳細を見る</a>
            <a class="btn ghost" th:href="${item.proposalDetailPath}">proposal 詳細</a>
          </div>
        </article>
      </div>

      <div class="card" th:if="${pageData.items.isEmpty()}">
        <div class="h2">まだ処理待ちの申請はありません</div>
        <p class="note">自分が主催者の pending 申請だけを表示しています。候補選択や申請作成のあとで確認できます。</p>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
