<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ちいきの入り口 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ちいきの入り口">
    <section class="section section--hero" aria-label="ヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">ちいきの入り口</h1>
      </div>
      <p class="lead">今のあなたから見えている gate の入口一覧です。申請や受け入れ判断はまだ次段階で、ここでは一覧と詳細の backend 接続だけを先に通しています。</p>
    </section>

    <section class="section">
      <div class="grid2" style="margin-top:16px;" th:if="${!pageData.items.isEmpty()}">
        <article class="card" th:each="item : ${pageData.items}">
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:center;">
            <span class="pill" th:text="${item.visibilityLabel}">PUBLIC</span>
            <span class="note" th:text="${item.durationMinutes != null ? item.durationMinutes + '分' : '所要時間未設定'}">60分</span>
          </div>
          <h2 class="h2" th:text="${item.title}">gate title</h2>
          <p class="note" th:text="${item.hostNickname != null ? '投稿者: ' + item.hostNickname : '投稿者未設定'}">投稿者</p>
          <p class="note" th:if="${item.locationName != null}" th:text="${'場所: ' + item.locationName}">場所</p>
          <p class="note" th:if="${item.summary != null}" th:text="${item.summary}">summary</p>
          <div class="proposalTags" th:if="${!item.tags.isEmpty()}">
            <span class="proposalTag" th:each="tag : ${item.tags}" th:text="${tag}">tag</span>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
            <a class="btn primary" th:href="@{/app/gate/{id}(id=${item.proposalId})}">詳細を見る</a>
            <span class="btn ghost" th:if="${item.owner}">投稿者として表示中</span>
          </div>
        </article>
      </div>

      <div class="card" th:if="${pageData.items.isEmpty()}">
        <div class="h2">まだ見える入り口はありません</div>
        <p class="note">公開範囲や関係性に応じて、ここに gate の入口が並びます。申請フローや受け入れ判断は次段階でつなぎます。</p>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
