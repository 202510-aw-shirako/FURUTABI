<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ちいきの入り口 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ちいきの入り口">
    <section class="section section--hero" aria-label="ヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">ちいきの入り口</h1>
        <a class="sectionTitleLink" href="/about.html?context=app#feature-gate">ご説明</a>
      </div>
      <p class="lead">今の自分から無理なく選べる入口カードを、静かに見比べられるページです。</p>
    </section>

    <section class="section" th:if="${!pageData.items.isEmpty()}">
      <div class="sectionTitleRow">
        <h2 class="h2">入口カード</h2>
        <span class="note">気になったものから詳細へ進めます。</span>
      </div>
      <div class="entryCarousel" aria-label="地域の入り口カード" data-entry-carousel style="margin-top:16px;">
        <div class="entryCarouselStage">
          <button class="btn ghost entryCarouselArrow entryCarouselArrow--prev" type="button" data-entry-prev aria-label="前の入口カード"></button>
          <div class="entryCarouselViewport">
            <div class="entryCarouselTrack" data-entry-track>
              <article class="card proposalCard proposalCard--gate entryCarouselCard"
                       data-entry-card
                       th:each="item : ${pageData.items}">
                <figure class="proposalPortrait">
                  <div class="ph ph--thumb" aria-hidden="true"></div>
                </figure>
                <div class="proposalCardMeta">
                  <span class="proposalDuration"
                        th:text="${item.durationMinutes != null ? item.durationMinutes + '分' : '時間は相談'}">30分</span>
                  <span class="proposalPersonMini"
                        th:text="${item.hostNickname != null ? item.hostNickname : '案内役'}">案内役</span>
                </div>
                <div class="proposalCardBody">
                  <h3 class="proposalTitle" th:text="${item.title}">入口カード名</h3>
                  <p class="proposalSummary"
                     th:text="${item.summary != null ? item.summary : 'その日の余力に合わせて選べる、やわらかな入口です。'}">説明</p>
                  <div class="proposalTags">
                    <span class="proposalTag" th:text="${item.visibilityLabel}">公開</span>
                    <span class="proposalTag" th:if="${item.locationName != null}" th:text="${item.locationName}">場所</span>
                    <span class="proposalTag" th:each="tag : ${item.tags}" th:text="${tag}">tag</span>
                  </div>
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                  <a class="btn ghost proposalMore" th:href="@{/app/gate/{id}(id=${item.proposalId})}">詳しく見る</a>
                  <span class="btn ghost" th:if="${item.owner}">提案中</span>
                </div>
              </article>
            </div>
          </div>
          <button class="btn ghost entryCarouselArrow entryCarouselArrow--next" type="button" data-entry-next aria-label="次の入口カード"></button>
        </div>
      </div>
    </section>

    <section class="section" th:if="${pageData.items.isEmpty()}">
      <div class="card">
        <div class="h2">まだ見えている入口はありません</div>
        <p class="note">公開範囲や関係性に応じて、ここに入口カードが並びます。</p>
      </div>
    </section>

    <section class="section">
      <div class="card">
        <div class="h2">運用ルール</div>
        <ul class="aboutFeatureList" data-rule-list="gate"></ul>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
  <script src="/assets/scripts/entry-carousel.js"></script>
</body>
</html>
