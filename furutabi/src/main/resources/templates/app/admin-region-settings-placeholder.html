<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>地域設定サマリ | FURUTABI</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container" aria-label="地域設定サマリ">
    <section style="max-width: 720px; margin: 48px auto;">
        <h1>地域設定サマリ</h1>
        <p th:text="${regionId + ' の地域設定は、この地域単位での運用対象を確認するための補助ページです。'}">
            地域設定サマリ
        </p>
        <p>この画面では地域単位で設定を持つことだけを確認し、個別の設定編集は別工程で扱います。</p>
        <p>
            <a href="/app/admin">admin入口へ戻る</a>
            <span th:if="${fromUserId != null}"> / </span>
            <a th:if="${fromUserId != null}" th:href="@{/app/admin/users/{id}(id=${fromUserId})}">対象ユーザー詳細へ戻る</a>
        </p>
    </section>
</main>
</body>
</html>
