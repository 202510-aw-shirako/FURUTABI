<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ごひいきさんの足あと | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ごひいきさんの足あと">
    <section class="section section--hero" aria-label="ページ案内">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section">
      <div class="sectionTitleRow">
        <h1 class="h1">ごひいきさんの足あと</h1>
        <a class="sectionTitleLink" href="/app/map-records">わたしの地図へ</a>
      </div>
      <p class="lead">
        <strong th:text="${pageData.currentUserLabel}">furutabi-user</strong>
        さんが見られる公開寄りの地図記録だけを、足あととして一覧します。
      </p>
      <div class="mypageNoticeBox" th:if="${pageData.filterState.active}">
        <p>
          <strong th:text="${pageData.filterState.ownerDisplayName}">owner</strong>
          さんのピンだけ表示中です。
          <a class="link" th:href="${pageData.filterState.clearPath}">解除</a>
        </p>
      </div>
    </section>

    <section class="section">
      <div class="grid2" th:if="${not #lists.isEmpty(pageData.records)}">
        <article class="card" th:each="record : ${pageData.records}">
          <div class="sectionTitleRow">
            <h2 class="h2" th:text="${record.title}">足あとタイトル</h2>
            <span class="pill" th:text="${record.visibilityLabel}">公開中</span>
          </div>
          <p class="note">
            <span th:text="${record.locationName} ?: '場所メモはまだありません'">場所メモ</span>
            <span th:if="${record.createdAt != null}" th:text="' / ' + ${record.createdAt}"> / 2026.03.27</span>
          </p>
          <p class="lead" th:text="${record.summary}">足あと要約</p>
          <p class="note">
            <span th:text="'記録した人: ' + ${record.ownerDisplayName}">記録した人: furutabi-user</span>
            <a class="link" th:href="${record.ownerFilterPath}" style="margin-left:8px;">このユーザーのピンだけ表示</a>
          </p>
          <div class="sectionTitleRow" style="margin-top:12px;">
            <span class="note" th:text="'画像 ' + ${record.imageCount} + ' 枚'">画像 0 枚</span>
            <span class="note" th:text="'コメント ' + ${record.commentCount} + ' 件'">コメント 0 件</span>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;">
            <span class="note" th:text="'いいね ' + ${record.engagement.likeCount}">いいね 0</span>
            <span class="note" th:text="'ありがとう ' + ${record.engagement.thanksCount}">ありがとう 0</span>
            <form th:if="${viewerAuthenticated and record.engagement.reactionAllowed}" th:action="@{/app/footprints/{id}/reaction(id=${record.id})}" method="post" style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="returnTo" th:value="${pageData.filterState.active ? '/app/footprints?userId=' + pageData.filterState.ownerUserId : '/app/footprints'}" />
              <button class="btn ghost" type="submit" th:text="${record.engagement.reactionActive} ? ${record.engagement.reactionLabel + 'を解除'} : ${record.engagement.reactionLabel}">いいね</button>
            </form>
            <form th:if="${viewerAuthenticated}" th:action="@{/app/footprints/{id}/bookmark(id=${record.id})}" method="post" style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="returnTo" th:value="${pageData.filterState.active ? '/app/footprints?userId=' + pageData.filterState.ownerUserId : '/app/footprints'}" />
              <button class="btn ghost" type="submit" th:text="${record.engagement.bookmarkedByViewer} ? 'ブックマーク解除' : 'ブックマーク'">ブックマーク</button>
            </form>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
            <a class="btn ghost" th:href="@{/app/footprints/{id}(id=${record.id})}">足あとを見る</a>
            <a class="btn ghost" th:href="@{/app/map-records/{id}(id=${record.id})}">地図詳細へ</a>
          </div>
        </article>
      </div>

      <div class="card" th:if="${#lists.isEmpty(pageData.records)}">
        <div class="h2">見える足あとはまだありません</div>
        <p class="note">公開または限定公開の地図記録が見えると、ここに足あととして並びます。</p>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
