<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ちいきのおかって | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ちいきのおかって">
    <section class="section section--hero" aria-label="ヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">ちいきのおかって</h1>
        <a class="sectionTitleLink" href="/about.html?context=app#feature-okatte">ご説明</a>
      </div>
      <p class="lead">少し関係ができた先で開かれる候補を、カードで静かに見比べられるページです。</p>
    </section>

    <section class="section" th:if="${!pageData.items.isEmpty()}">
      <div class="sectionTitleRow">
        <h2 class="h2">候補カード</h2>
        <span class="note">気になる候補から詳細へ進めます。</span>
      </div>
      <div class="proposalGrid" style="margin-top:16px;">
        <article class="card proposalCard proposalCard--okatte"
                 th:each="item : ${pageData.items}">
          <figure class="proposalVisual">
            <div class="ph ph--pageHero" aria-hidden="true"></div>
            <span class="proposalFaceChip">
              <div class="ph ph--avatar" aria-hidden="true"></div>
            </span>
          </figure>
          <div class="proposalCardMeta">
            <span class="proposalDuration"
                  th:text="${item.durationMinutes != null ? item.durationMinutes + '分' : '時間は相談'}">60分</span>
            <span class="proposalPersonMini"
                  th:text="${item.hostNickname != null ? item.hostNickname : '地域の方'}">地域の方</span>
          </div>
          <div class="proposalCardBody">
            <h3 class="proposalTitle" th:text="${item.title}">候補名</h3>
            <p class="proposalSummary"
               th:text="${item.summary != null ? item.summary : '少し先の時間が想像できる候補です。'}">説明</p>
            <div class="proposalTags">
              <span class="proposalTag" th:text="${item.visibilityLabel}">公開</span>
              <span class="proposalTag" th:if="${item.locationName != null}" th:text="${item.locationName}">場所</span>
              <span class="proposalTag" th:each="tag : ${item.tags}" th:text="${tag}">tag</span>
            </div>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
            <a class="btn ghost proposalMore" th:href="@{/app/okatte/{id}(id=${item.proposalId})}">候補を見る</a>
            <span class="btn ghost" th:if="${item.owner}">提案中</span>
          </div>
        </article>
      </div>
    </section>

    <section class="section" th:if="${pageData.items.isEmpty()}">
      <div class="card">
        <div class="h2">まだ見えている候補はありません</div>
        <p class="note">公開範囲や関係性に応じて、ここに候補カードが並びます。</p>
      </div>
    </section>

    <section class="section">
      <div class="card">
        <div class="h2">運用ルール</div>
        <ul class="aboutFeatureList" data-rule-list="okatte"></ul>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
