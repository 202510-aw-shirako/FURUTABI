<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ちいきのおかって | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ちいきのおかって候補">
    <section class="section section--hero" aria-label="ヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">ちいきのおかって</h1>
      </div>
      <p class="lead">架け橋さんが提案したおかって候補を見て、申請したいものを選ぶための一覧です。地域側の最終判断と chat 開通はまだ次段階です。</p>
    </section>

    <section class="section">
      <div class="grid2" style="margin-top:16px;" th:if="${!pageData.items.isEmpty()}">
        <article class="card" th:each="item : ${pageData.items}">
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:center;">
            <span class="pill" th:text="${item.visibilityLabel}">PUBLIC</span>
            <span class="note" th:text="${item.durationMinutes != null ? item.durationMinutes + '分' : '所要時間は次段階で整理'}">60分</span>
          </div>
          <h2 class="h2" th:text="${item.title}">okatte title</h2>
          <p class="note" th:text="${item.hostNickname != null ? '地域側: ' + item.hostNickname : '地域側は次段階で整理'}">地域側</p>
          <p class="note" th:if="${item.locationName != null}" th:text="${'場所: ' + item.locationName}">場所</p>
          <p class="note" th:if="${item.summary != null}" th:text="${item.summary}">summary</p>
          <div class="proposalTags" th:if="${!item.tags.isEmpty()}">
            <span class="proposalTag" th:each="tag : ${item.tags}" th:text="${tag}">tag</span>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
            <a class="btn primary" th:href="@{/app/okatte/{id}(id=${item.proposalId})}">候補を見る</a>
            <span class="btn ghost" th:if="${item.owner}">投稿者として表示中</span>
          </div>
        </article>
      </div>

      <div class="card" th:if="${pageData.items.isEmpty()}">
        <div class="h2">まだ見えるおかって候補はありません</div>
        <p class="note">架け橋さん側から提示された候補が、ここで backend 一覧として見えるようになります。候補提案の拡張は次段階です。</p>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
