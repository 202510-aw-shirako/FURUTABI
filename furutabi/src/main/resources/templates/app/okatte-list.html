<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ちいきのおかって | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ちいきのおかって">
    <section class="section section--hero" aria-label="ヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">ちいきのおかって</h1>
        <a class="sectionTitleLink" href="/about.html?context=app#feature-okatte">ちいきのおかってについて</a>
      </div>
      <p class="lead">
        地域の暮らしの延長にあるお願いごとです。地図で位置を見て、
        その下のカードから詳しく見られます。
      </p>
    </section>

    <section class="section" th:if="${#lists.isEmpty(pageData.items)}">
      <div class="card">
        <div class="h2">まだ候補はありません</div>
        <p class="note">地域側の準備が進むと、ここに地図とカードが並びます。</p>
      </div>
    </section>

    <section class="section proposalDetailMapSection" th:if="${not #lists.isEmpty(pageData.items)}">
      <div class="sectionTitleRow">
        <h2 class="h2">地図で見る</h2>
        <span class="note">地図のピンと下のカードが対応しています。</span>
      </div>
      <p class="lead">場所を見てから、気になるおかっての詳細へ進めます。</p>

      <div class="topMapLayout appTopMapLayout proposalDetailMapLayout" style="margin-top:16px;">
        <div class="myMapMain">
          <div class="topMapStage" aria-label="ちいきのおかっての地図">
            <div class="myMapViewport">
              <img class="topMapCanvas topMapCanvasImage" src="/assets/images/凪咲町.svg" alt="ちいきのおかっての地図" />
              <div class="myMapPinsLayer" aria-hidden="false">
                <a
                  class="topMapPin"
                  th:classappend="${item.pinClass}"
                  th:href="@{/app/okatte/{id}(id=${item.proposalId})}"
                  th:each="item, stat : ${pageData.items}"
                  th:aria-label="${item.title}">
                  <span th:text="${stat.count}">1</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="proposalGrid" style="margin-top:16px;">
        <article class="card proposalCard proposalCard--okatte" th:each="item, stat : ${pageData.items}">
          <figure class="proposalVisual">
            <div class="ph ph--pageHero" aria-hidden="true"></div>
            <span class="proposalFaceChip">
              <div class="ph ph--avatar" aria-hidden="true"></div>
            </span>
          </figure>
          <div class="proposalCardMeta">
            <span class="topMapMarker proposalCardMarker"><span th:text="${stat.count}">1</span></span>
            <span class="proposalDuration" th:text="${item.durationMinutes != null ? item.durationMinutes + '分' : '時間は相談で調整'}">60分</span>
            <span class="proposalPersonMini" th:text="${item.hostNickname != null ? item.hostNickname : '地域の方'}">地域の方</span>
          </div>
          <div class="proposalCardBody">
            <h3 class="proposalTitle" th:text="${item.title}">おかってタイトル</h3>
            <p class="proposalSummary" th:text="${item.summary != null ? item.summary : '地域の暮らしの中でお願いしたい内容を短くまとめています。'}">summary</p>
            <div class="proposalTags">
              <span class="proposalTag" th:text="${item.visibilityLabel}">公開範囲</span>
              <span class="proposalTag" th:if="${item.locationName != null}" th:text="${item.locationName}">location</span>
              <span class="proposalTag" th:each="tag : ${item.tags}" th:text="${tag}">tag</span>
            </div>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
            <a class="btn ghost proposalMore" th:href="@{/app/okatte/{id}(id=${item.proposalId})}">詳細</a>
            <span class="btn ghost" th:if="${item.owner}">申込み中</span>
          </div>
        </article>
      </div>
    </section>

    <section class="section">
      <div class="card">
        <div class="h2">知っておくこと</div>
        <ul class="aboutFeatureList" data-rule-list="okatte"></ul>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
