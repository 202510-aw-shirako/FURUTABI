<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>申請詳細 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_local_member"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="架け橋さん向け申請詳細">
    <section class="section section--hero" aria-label="ページヒーロー">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1" th:text="${pageData.title}">申請タイトル</h1>
        <a class="sectionTitleLink" href="/app/bridge-applications">一覧へ戻る</a>
      </div>
      <div class="mypageNoticeBox" th:if="${param.accepted}">
        <p>申請を受諾しました。chat 開通はまだ次段階です。</p>
      </div>
      <div class="mypageNoticeBox" th:if="${param.rejected}">
        <p>申請を拒否しました。chat はまだ開いていません。</p>
      </div>
      <div class="mypageNoticeBox" th:if="${param.blocked}">
        <p>この申請はすでに判断済みか、現在は操作できません。</p>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
        <span class="pill" th:text="${pageData.applicationStatus}">pending</span>
        <span class="pill pill--soft"
              th:text="${pageData.durationMinutes != null ? pageData.durationMinutes + '分' : '所要時間は次段階で設定'}">60分</span>
      </div>
      <p class="lead" th:if="${pageData.summary != null}" th:text="${pageData.summary}">summary</p>
    </section>

    <section class="section">
      <div class="grid2">
        <article class="card">
          <div class="h2">申請内容</div>
          <p class="note" th:text="${'申請者: ' + pageData.applicantNickname}">申請者</p>
          <p class="note" th:text="${'地域担当: ' + pageData.hostNickname}">地域担当</p>
          <p class="note" th:if="${pageData.locationName != null}" th:text="${'場所: ' + pageData.locationName}">場所</p>
          <p class="note" th:if="${pageData.appliedAt != null}"
             th:text="${'申請日時: ' + #temporals.format(pageData.appliedAt, 'yyyy-MM-dd HH:mm')}">申請日時</p>
          <p class="note" th:if="${pageData.latestMessagePreview != null}" th:text="${pageData.latestMessagePreview}">申請メモ</p>
          <p class="note" th:if="${pageData.latestMessagePreview == null}">申請メモはまだありません。</p>
        </article>

        <article class="card">
          <div class="h2">判断</div>
          <p class="note" th:if="${pageData.canReview}">今は pending なので、受諾または拒否を選べます。</p>
          <p class="note" th:if="${!pageData.canReview}">この申請はすでに判断済みです。再受諾や再拒否はできません。</p>
          <p class="note" th:text="${pageData.chatOpened ? '関連 chat は作成済みです。' : '関連 chat はまだ開いていません。'}">chat 状態</p>

          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;" th:if="${pageData.canReview}">
            <form th:action="@{/app/bridge-applications/{id}/accept(id=${pageData.applicationId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="btn primary">受諾する</button>
            </form>
            <form th:action="@{/app/bridge-applications/{id}/reject(id=${pageData.applicationId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="btn ghost">拒否する</button>
            </form>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
