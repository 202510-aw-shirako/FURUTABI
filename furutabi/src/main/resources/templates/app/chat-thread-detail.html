<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>連絡詳細 | FURUTABI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="app_home"></nav>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section fv">
      <div class="sectionTitleRow">
        <h1 class="h1">連絡詳細</h1>
        <a class="sectionTitleLink" href="/app/chat">一覧へ戻る</a>
      </div>
      <div class="mypageNoticeBox" th:if="${param.sent}">
        <p>message を送信しました。</p>
      </div>
      <div class="mypageNoticeBox" th:if="${param.blocked}">
        <p>この thread には今は送信できません。</p>
      </div>
    </section>

    <section class="section">
      <div class="chatShell">
        <div class="chatMain">
          <article class="chatThreadHeader">
            <div class="chatThreadTitle" th:text="${pageData.title}">thread title</div>
            <div class="chipRow chatThreadMeta">
              <span class="pill pill--soft" th:text="${pageData.counterpartNickname}">counterpart</span>
              <span class="pill" th:text="${pageData.counterpartRole}">role</span>
              <span class="pill pill--soft" th:text="${pageData.status}">open</span>
            </div>
            <div class="chatThreadActions">
              <a class="btn ghost" th:if="${pageData.relatedUrl != null}" th:href="${pageData.relatedUrl}">申請詳細へ</a>
              <a class="btn ghost" href="/app/history">関わりの記録へ</a>
              <a class="btn ghost" href="/app/notifications">通知一覧へ</a>
            </div>
          </article>

          <section class="chatMessages">
            <article th:each="message : ${pageData.messages}"
                     th:class="${message.systemMessage ? 'chatSystemMessage' : (message.mine ? 'chatMessage is-mine' : 'chatMessage')}">
              <div th:if="${!message.systemMessage}" class="chatMessageMeta">
                <span th:text="${message.senderNickname != null ? message.senderNickname : 'system'}">sender</span>
                <span th:text="${message.senderRole}">role</span>
                <time th:text="${#temporals.format(message.createdAt.toLocalDateTime(), 'yyyy-MM-dd HH:mm')}">2026-03-27 10:00</time>
              </div>
              <p class="chatMessageBody" th:text="${message.body}">message body</p>
            </article>
            <article class="chatAlert" th:if="${pageData.messages.isEmpty()}">
              <p>まだ message はありません。</p>
            </article>
          </section>

          <section class="chatComposer" th:if="${pageData.canSend}">
            <form th:action="@{/app/chat/{id}/messages(id=${pageData.threadId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <label class="fieldLabel" for="chatMessageBody">message</label>
              <textarea id="chatMessageBody"
                        name="body"
                        rows="4"
                        maxlength="4000"
                        placeholder="会話に必要な最小 message を送ります。"></textarea>
              <div class="chatComposerActions">
                <button type="submit" class="btn primary">送信する</button>
              </div>
            </form>
          </section>

          <section class="chatAlert" th:if="${!pageData.canSend}">
            <p>この thread は closed 状態のため、今は送信できません。</p>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/scripts/shared-ui.js"></script>
</body>
</html>
