spring:
  datasource:
    url: jdbc:h2:mem:furutabi-dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  devtools:
    livereload:
      enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

logging:
  level:
    root: info
    com.furutabi: debug
    org.mybatis: debug

app:
  file-storage:
    base-dir: ./uploads/dev
