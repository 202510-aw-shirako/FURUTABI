<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FURUTABI Wire | Login</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI｜郷旅</div>
        <nav data-site-nav="auth_login"></nav>
      </div>
    </div>
  </header>

  <main class="container" aria-label="ログイン">
    <section class="section section--hero" aria-label="ヒーローイメージ">
      <div class="fullbleed">
        <div class="ph ph--pageHero" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section fv">
      <h1 class="h1">ログイン認証</h1>
      <p class="lead">ブリッジからは公開トップを経由せず、ここへ直行。</p>
    </section>

    <section class="section">
      <div class="grid2">
        <div class="card">
          <div class="h2">メールでログイン</div>
          <p class="note">ワイヤ：入力欄はプレースホルダー。</p>
          <div style="display:grid; gap:12px; margin-top:12px;">
            <div>
              <div class="small">メール</div>
              <div class="ph ph--line w-90" style="height:42px; border-radius:12px;"></div>
            </div>
            <div>
              <div class="small">パスワード</div>
              <div class="ph ph--line w-80" style="height:42px; border-radius:12px;"></div>
            </div>
          </div>
          <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn primary" href="../app/home.html">ログイン（ワイヤ）</a>
            <a class="btn ghost" href="#">パスワードを忘れた（ワイヤ）</a>
          </div>
        </div>

        <div class="card">
          <div class="h2">他の方法</div>
          <p class="note">ワイヤ：SSO等の入口。</p>
          <div style="display:grid; gap:10px; margin-top:12px;">
            <a class="btn ghost" href="../app/home.html">Googleで続行（ワイヤ）</a>
            <a class="btn ghost" href="../app/home.html">Appleで続行（ワイヤ）</a>
          </div>
          <div class="denseBox" style="margin-top:16px;">
            <div>
              <div class="h2">登録</div>
              <p class="note">関わる入口を開くための登録。</p>
            </div>
            <a class="btn primary" href="../public/gate.html">登録へ（ワイヤ）</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../public/assets/scripts/shared-ui.js"></script>
</body>
</html>
