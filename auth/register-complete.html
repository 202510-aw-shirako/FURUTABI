<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>登録完了 | FURUTABI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="inner">
        <div class="brand">FURUTABI</div>
        <nav data-site-nav="auth_login"></nav>
      </div>
    </div>
  </header>

  <main class="container authPage authPage--centered" aria-label="登録完了">
    <section class="authCompleteCard">
      <div class="authCompleteMark" aria-hidden="true">✓</div>
      <p class="eyebrow">COMPLETE</p>
      <h1 class="authFlowTitle">登録が完了しました</h1>
      <p class="authFlowLead">これから、無理のない入口から少しずつ関わりを始められます。</p>

      <div class="authCompleteGrid">
        <section class="authCompletePanel">
          <h2>完了したこと</h2>
          <ul class="authList">
            <li>登録情報の入力が完了しました</li>
            <li>SMS認証の確認が完了した想定です</li>
          </ul>
        </section>
        <section class="authCompletePanel">
          <h2>最初にできること</h2>
          <ul class="authList">
            <li>ちいきの入り口を見る</li>
            <li>ごひいきさんの足あとを読む</li>
            <li>FAQを見る</li>
          </ul>
        </section>
        <section class="authCompletePanel">
          <h2>あとでできること</h2>
          <ul class="authList">
            <li>プロフィールを整える</li>
            <li>わたしの地図を使い始める</li>
            <li>ちいきのおかってに進む</li>
          </ul>
        </section>
      </div>

      <div class="authFormActions authFormActions--center">
        <a class="btn primary" href="../app/home.html">ホームへ</a>
      </div>

      <div class="authUtilityLinks authUtilityLinks--center" aria-label="登録完了後の関連リンク">
        <a href="../public/gate.html">ちいきの入り口へ</a>
        <a href="../public/faq.html">FAQを見る</a>
        <a href="./register-profile.html">プロフィールを編集する</a>
      </div>
    </section>
  </main>

  <script src="../public/assets/scripts/shared-ui.js"></script>
  <script>
    // Java実装時の目印:
    // この完了画面に来る前に users.sms_verified=true、users.registration_completed=true まで進んでいる前提です。
    // 認証コードの状態管理は users ではなく sms_verifications 側で持ち、成功時は status=VERIFIED / used_at 設定で閉じる想定です。
    // 追加本人確認は別条件で発火し、この完了画面とは分けて扱う前提にしておくと整理しやすそうです。
  </script>
</body>
</html>
